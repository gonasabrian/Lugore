<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUGORE SACCO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f2f2f2;margin:0;padding:15px}
.card{background:#fff;padding:20px;border-radius:12px;max-width:450px;margin:20px auto;box-shadow:0 2px 10px #0002}
input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc;font-size:16px;box-sizing:border-box}
button{background:#0a7a42;color:#fff;border:none;font-weight:bold;cursor:pointer}
button.red{background:#c0392b} button.blue{background:#2471a3}
h2{text-align:center;color:#0a7a42} .hidden{display:none}
table{width:100%;border-collapse:collapse;font-size:14px} td,th{border-bottom:1px solid #eee;padding:8px;text-align:left}
</style>
</head>
<body>

<div id="loginPage" class="card">
<h2>LUGORE SACCO</h2>
<p style="text-align:center">Login with your number</p>
<input id="username" placeholder="Username e.g. 18063 or admin">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">LOGIN</button>
<p id="loginMsg" style="color:red;text-align:center"></p>
<p style="font-size:12px;text-align:center;color:#888">Admin: admin / admin<br>Member: your number / your number<br>e.g. Gonasa Brian: 18063 / 18063</p>
</div>

<div id="appPage" class="card hidden">
<h2 id="welcome">Welcome</h2>
<p id="userInfo" style="text-align:center"></p>
<button class="blue" onclick="loadMyData()">Refresh My Savings & Loans</button>
<h3>My Savings</h3>
<div id="mySavings">Loading...</div>
<h3>My Loans</h3>
<div id="myLoans">Loading...</div>

<div id="adminBox" class="hidden">
<hr>
<h3>Admin - Add Saving</h3>
<input id="s_member" placeholder="Member name e.g. Gonasa Brian">
<input id="s_amount" type="number" placeholder="Amount">
<input id="s_month" placeholder="Month e.g. Nov 2026">
<button onclick="addSaving()">Add Saving</button>
<h3>Admin - All Members</h3>
<div id="allMembers"></div>
</div>

<button class="red" onclick="logout()">Logout</button>
</div>

<script>
const SUPABASE_URL = "https://mpndeajnoxrmvpxtbrlo.supabase.co";
const SUPABASE_KEY = "sb_publishable_DHyal88n3SWkgeOn29k2tQ__AhyXEoD";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentUser = null;

async function login(){
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  document.getElementById('loginMsg').innerText = "Checking...";
  const { data, error } = await supabase.from('members').select('*').eq('username', u).eq('password', p).single();
  if(error || !data){ document.getElementById('loginMsg').innerText = "Wrong username or password"; return; }
  currentUser = data;
  localStorage.setItem('lugore_user', JSON.stringify(data));
  showApp();
  await supabase.from('login_logs').insert({username: u, role: data.role});
}

function showApp(){
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('appPage').classList.remove('hidden');
  document.getElementById('welcome').innerText = "Welcome, " + currentUser.name;
  document.getElementById('userInfo').innerText = currentUser.role + " | " + currentUser.username;
  if(currentUser.role === 'admin'){
    document.getElementById('adminBox').classList.remove('hidden');
    loadAllMembers();
  }
  loadMyData();
}

async function loadMyData(){
  const { data: sav } = await supabase.from('savings').select('*').eq('member', currentUser.name);
  let total = 0; let html = "<table><tr><th>Month</th><th>Amount</th></tr>";
  (sav||[]).forEach(s=>{ total += Number(s.amount||0); html += `<tr><td>${s.month||''}</td><td>${s.amount}</td></tr>`; });
  html += `</table><b>Total Savings: ${total}</b>`;
  document.getElementById('mySavings').innerHTML = html;

  const { data: loans } = await supabase.from('loans').select('*').eq('member', currentUser.name);
  let html2 = "<table><tr><th>Principal</th><th>Total Due</th><th>Paid</th><th>Status</th></tr>";
  (loans||[]).forEach(l=>{ html2 += `<tr><td>${l.principal}</td><td>${l.total_due}</td><td>${l.paid}</td><td>${l.status}</td></tr>`; });
  html2 += "</table>";
  document.getElementById('myLoans').innerHTML = html2;
}

async function loadAllMembers(){
  const { data } = await supabase.from('members').select('*').order('name');
  let h = "<table><tr><th>Name</th><th>Username</th></tr>";
  (data||[]).forEach(m=>{ h += `<tr><td>${m.name}</td><td>${m.username}</td></tr>`; });
  h += "</table>";
  document.getElementById('allMembers').innerHTML = h;
}

async function addSaving(){
  const m = document.getElementById('s_member').value.trim();
  const a = Number(document.getElementById('s_amount').value);
  const mo = document.getElementById('s_month').value.trim();
  if(!m || !a){ alert("Fill member and amount"); return; }
  const { error } = await supabase.from('savings').insert({member: m, amount: a, month: mo, created_by: currentUser.name});
  if(error) alert(error.message); else { alert("Saved!"); loadMyData(); }
}

function logout(){ localStorage.removeItem('lugore_user'); location.reload(); }

const saved = localStorage.getItem('lugore_user');
if(saved){ currentUser = JSON.parse(saved); showApp(); }
</script>
</body>
</html>
