<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SACCO App</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:system-ui,Arial}body{margin:0;background:#f3f4f6;color:#111}
header{background:#111827;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px}header button{background:#ef4444;color:#fff;border:0;padding:8px 12px;border-radius:8px;cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
input,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;margin:6px 0;font-size:15px}
button.btn{width:100%;padding:12px;border:0;border-radius:9px;background:#111827;color:#fff;font-weight:700;cursor:pointer;margin-top:6px}
button.btn2{background:#059669}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 8px;border-bottom:1px solid #eee;text-align:left}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;padding:11px;border:0;border-radius:9px;background:#e5e7eb;cursor:pointer;font-weight:700}.tabs button.active{background:#111827;color:#fff}
.hidden{display:none}.muted{color:#6b7280;font-size:13px}.big{font-size:28px;font-weight:800}
</style>
</head>
<body>
<header><b>SACCO Savings</b><span id="topUser"></span><button id="logoutBtn" class="hidden">Logout</button></header>
<div class="wrap">
<div id="loginView" class="card">
<h2>Login</h2>
<input id="loginName" placeholder="Username">
<input id="loginPass" type="password" placeholder="Password">
<button class="btn" onclick="login()">Login</button>
<p id="loginMsg" style="color:red"></p>
</div>
<div id="appView" class="hidden">
<div class="card"><div class="muted" id="welcome"></div><div class="big" id="totalLabel">UGX 0</div><div class="muted" id="totalSub"></div></div>
<div id="adminTabs" class="tabs hidden">
<button id="tabDash" class="active" onclick="showTab('dash')">Dashboard</button>
<button onclick="showTab('members')">Members</button>
<button onclick="showTab('addSaving')">Add Savings</button>
<button onclick="showTab('addMember')">Add Member</button>
</div>
<div id="dashView">
<div class="card"><h3 id="dashTitle">All Savings</h3><div id="allSavings"></div></div>
</div>
<div id="membersView" class="hidden">
<div class="card"><h3>Members</h3><div id="membersList"></div></div>
</div>
<div id="addSavingView" class="hidden">
<div class="card"><h3>Add Savings</h3>
<select id="saveMember"></select>
<input id="saveAmount" type="number" placeholder="Amount e.g. 50000">
<input id="saveNote" placeholder="Note e.g. March savings">
<button class="btn btn2" onclick="addSaving()">Record Savings</button>
<p id="saveMsg"></p></div>
</div>
<div id="addMemberView" class="hidden">
<div class="card"><h3>Add Member</h3>
<input id="newName" placeholder="Full Name">
<input id="newPass" placeholder="Password / Number">
<button class="btn btn2" onclick="addMember()">Add Member</button>
<p id="memberMsg"></p></div>
</div>
<div id="memberView" class="hidden">
<div class="card"><h3>My Savings</h3><p class="muted">You cannot add savings. Only Admin can record your savings.</p><div id="mySavings"></div></div>
</div>
</div>
</div>
<script>
const SUPABASE_URL="https://mpndeajnoxrmvpxtbrlo.supabase.co";
const SUPABASE_KEY="sb_publishable_DHyal88n3SWkgeOn29k2tQ__AhyXEoD";
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null;
let allMembers=[];
function norm(s){return (s||"").trim().toLowerCase().replace(/\s+/g," ")}
async function login(){
const name=document.getElementById("loginName").value.trim();
const pass=document.getElementById("loginPass").value.trim();
document.getElementById("loginMsg").textContent="";
if(!name||!pass){document.getElementById("loginMsg").textContent="Enter name and password";return}
const {data,error}=await supabase.from("members").select("*");
if(error){document.getElementById("loginMsg").textContent=error.message;return}
const found=(data||[]).find(m=>norm(m.name)===norm(name)&&String(m.password)===String(pass));
if(!found){document.getElementById("loginMsg").textContent="Wrong username or password";return}
currentUser=found;
localStorage.setItem("sacco_user",JSON.stringify(found));
render();
}
function logout(){currentUser=null;localStorage.removeItem("sacco_user");render()}
document.getElementById("logoutBtn").onclick=logout;
async function render(){
if(!currentUser){
const saved=localStorage.getItem("sacco_user");
if(saved){currentUser=JSON.parse(saved)}else{
document.getElementById("loginView").classList.remove("hidden");
document.getElementById("appView").classList.add("hidden");
document.getElementById("logoutBtn").classList.add("hidden");
document.getElementById("topUser").textContent="";return}}
}
document.getElementById("loginView").classList.add("hidden");
document.getElementById("appView").classList.remove("hidden");
document.getElementById("logoutBtn").classList.remove("hidden");
document.getElementById("topUser").textContent=currentUser.name;
document.getElementById("welcome").textContent="Logged in as "+currentUser.name+" ("+currentUser.role+")";
const isAdmin=norm(currentUser.role)==="admin";
if(isAdmin){
document.getElementById("adminTabs").classList.remove("hidden");
document.getElementById("memberView").classList.add("hidden");
document.getElementById("dashView").classList.remove("hidden");
showTab("dash");
await loadAdmin();
}else{
document.getElementById("adminTabs").classList.add("hidden");
document.getElementById("dashView").classList.add("hidden");
document.getElementById("membersView").classList.add("hidden");
document.getElementById("addSavingView").classList.add("hidden");
document.getElementById("addMemberView").classList.add("hidden");
document.getElementById("memberView").classList.remove("hidden");
await loadMember();
}
}
function showTab(t){
if(!currentUser||norm(currentUser.role)!=="admin")return;
["dashView","membersView","addSavingView","addMemberView"].forEach(id=>document.getElementById(id).classList.add("hidden"));
document.getElementById("tabDash").classList.remove("active");
if(t==="dash")document.getElementById("dashView").classList.remove("hidden");
if(t==="members")document.getElementById("membersView").classList.remove("hidden");
if(t==="addSaving")document.getElementById("addSavingView").classList.remove("hidden");
if(t==="addMember")document.getElementById("addMemberView").classList.remove("hidden");
}
async function loadAdmin(){
const {data:members}=await supabase.from("members").select("*").order("name");
allMembers=(members||[]).filter(m=>norm(m.role)!=="admin");
const {data:savings}=await supabase.from("savings").select("*").order("created_at",{ascending:false});
const total=(savings||[]).reduce((s,x)=>s+(Number(x.amount)||0),0);
document.getElementById("totalLabel").textContent="UGX "+total.toLocaleString();
document.getElementById("totalSub").textContent="Total Savings";
document.getElementById("dashTitle").textContent="All Savings";
let h="<table><tr><th>Member</th><th>Amount</th><th>Note</th><th>Date</th></tr>";
(savings||[]).forEach(s=>{
const m=allMembers.find(x=>x.id===s.member_id);
h+="<tr><td>"+(m?m.name:"Unknown")+"</td><td>UGX "+(Number(s.amount)||0).toLocaleString()+"</td><td>"+(s.note||"")+"</td><td>"+new Date(s.created_at).toLocaleDateString()+"</td></tr>";
});
h+="</table>";
document.getElementById("allSavings").innerHTML=h;
let mh="<table><tr><th>Name</th><th>Password</th><th>Total Saved</th></tr>";
allMembers.forEach(m=>{
const tot=(savings||[]).filter(s=>s.member_id===m.id).reduce((a,b)=>a+(Number(b.amount)||0),0);
mh+="<tr><td>"+m.name+"</td><td>"+m.password+"</td><td>UGX "+tot.toLocaleString()+"</td></tr>";
});
mh+="</table>";
document.getElementById("membersList").innerHTML=mh;
let opts="";
allMembers.forEach(m=>{opts+='<option value="'+m.id+'">'+m.name+'</option>'});
document.getElementById("saveMember").innerHTML=opts;
}
async function loadMember(){
const {data:savings}=await supabase.from("savings").select("*").eq("member_id",currentUser.id).order("created_at",{ascending:false});
const total=(savings||[]).reduce((s,x)=>s+(Number(x.amount)||0),0);
document.getElementById("totalLabel").textContent="UGX "+total.toLocaleString();
document.getElementById("totalSub").textContent="My Total Savings";
let h="<table><tr><th>Amount</th><th>Note</th><th>Date</th></tr>";
(savings||[]).forEach(s=>{
h+="<tr><td>UGX "+(Number(s.amount)||0).toLocaleString()+"</td><td>"+(s.note||"")+"</td><td>"+new Date(s.created_at).toLocaleDateString()+"</td></tr>";
});
h+="</table>";
if((savings||[]).length===0)h="<p class='muted'>No savings yet.</p>";
document.getElementById("mySavings").innerHTML=h;
}
async function addSaving(){
if(!currentUser||norm(currentUser.role)!=="admin"){alert("Only Admin can add savings");return}
const member_id=document.getElementById("saveMember").value;
const amount=Number(document.getElementById("saveAmount").value);
const note=document.getElementById("saveNote").value.trim();
if(!member_id||!amount){document.getElementById("saveMsg").textContent="Select member and amount";return}
const {error}=await supabase.from("savings").insert([{member_id,amount,note}]);
if(error){document.getElementById("saveMsg").textContent=error.message;return}
document.getElementById("saveMsg").textContent="Saved!";
document.getElementById("saveAmount").value="";document.getElementById("saveNote").value="";
await loadAdmin();
}
async function addMember(){
if(!currentUser||norm(currentUser.role)!=="admin"){alert("Only Admin can add members");return}
const name=document.getElementById("newName").value.trim();
const password=document.getElementById("newPass").value.trim();
if(!name||!password){document.getElementById("memberMsg").textContent="Enter name and password";return}
const {error}=await supabase.from("members").insert([{name,password,role:"member"}]);
if(error){document.getElementById("memberMsg").textContent=error.message;return}
document.getElementById("memberMsg").textContent="Member added!";
document.getElementById("newName").value="";document.getElementById("newPass").value="";
await loadAdmin();
}
render();
</script>
</body>
</html>
