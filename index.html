<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUGORE - Ride App</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#0f172a;color:white;padding:16px}
.header{text-align:center;margin-bottom:16px}
.header h1{font-size:32px;margin:0;color:#facc15}
.header p{color:#cbd5e1;margin:4px 0 0}
.card{background:#1e293b;border-radius:16px;padding:16px;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:12px;border:0;border-radius:12px;font-weight:bold;cursor:pointer}
.tabs button.active{background:#facc15;color:black}
.tabs button.inactive{background:#334155;color:white}
label{font-size:13px;color:#cbd5e1}
input,select{width:100%;padding:12px;border-radius:10px;border:0;margin:6px 0 12px;background:#0f172a;color:white;outline:1px solid #334155}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#facc15;color:black;font-weight:bold;font-size:16px;cursor:pointer}
.btn-green{background:#22c55e;color:white}
.btn-red{background:#ef4444;color:white}
.ride{background:#0f172a;border:1px solid #334155;border-radius:12px;padding:12px;margin-bottom:10px}
.ride b{color:#facc15}
.small{font-size:12px;color:#94a3b8}
.status{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold;display:inline-block}
.pending{background:#facc15;color:black}
.accepted{background:#22c55e;color:white}
.completed{background:#334155;color:white}
.hidden{display:none}
</style>
</head>
<body>

<div class="header">
  <h1>🛵 LUGORE</h1>
  <p>Fast Boda & Ride in Kampala</p>
  <p class="small" id="conn">Connecting...</p>
</div>

<div class="tabs">
  <button id="tabRider" class="active" onclick="showTab('rider')">🧑 RIDER - Book Ride</button>
  <button id="tabDriver" class="inactive" onclick="showTab('driver')">🏍️ DRIVER</button>
</div>

<!-- RIDER -->
<div id="riderView">
  <div class="card">
    <h3 style="margin:0 0 10px">Book a Ride</h3>
    <label>Your Name</label>
    <input id="riderName" placeholder="e.g. Brian Gona">
    <label>Phone</label>
    <input id="riderPhone" placeholder="e.g. 0700 123456">
    <label>Pickup Location</label>
    <input id="pickup" placeholder="e.g. Kampala Road, Nakasero">
    <label>Dropoff Location</label>
    <input id="dropoff" placeholder="e.g. Ntinda, Kigowa">
    <button class="btn" onclick="bookRide()">Request Ride 🚀</button>
    <p id="bookMsg" class="small"></p>
  </div>

  <div class="card">
    <h3 style="margin:0 0 10px">My Rides / Live Rides</h3>
    <button class="btn" style="background:#334155;color:white" onclick="loadRides()">Refresh Rides 🔄</button>
    <div id="ridesList" style="margin-top:12px"></div>
  </div>
</div>

<!-- DRIVER -->
<div id="driverView" class="hidden">
  <div class="card">
    <h3 style="margin:0 0 10px">Driver Registration</h3>
    <label>Driver Name</label>
    <input id="driverName" placeholder="e.g. John Kato">
    <label>Phone</label>
    <input id="driverPhone" placeholder="e.g. 0770 123456">
    <label>Vehicle</label>
    <input id="vehicle" placeholder="e.g. Bajaj Boxer - Boda">
    <label>Plate Number</label>
    <input id="plate" placeholder="e.g. UFG 123A">
    <button class="btn btn-green" onclick="registerDriver()">Register as Driver ✅</button>
    <p id="driverMsg" class="small"></p>
  </div>

  <div class="card">
    <h3 style="margin:0 0 10px">Available Rides - Pending</h3>
    <button class="btn" style="background:#334155;color:white" onclick="loadRides()">Refresh 🔄</button>
    <div id="driverRidesList" style="margin-top:12px"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://mpndeajnoxrmvpxtbrlo.supabase.co";
const SUPABASE_KEY = "sb_publishable_DHyal88n3SWkgeOn29k2tQ__AhyXEoD";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentDriverId = localStorage.getItem('lugore_driver_id') || null;

function showTab(tab){
  document.getElementById('riderView').classList.toggle('hidden', tab!=='rider');
  document.getElementById('driverView').classList.toggle('hidden', tab!=='driver');
  document.getElementById('tabRider').className = tab==='rider' ? 'active' : 'inactive';
  document.getElementById('tabDriver').className = tab==='driver' ? 'active' : 'inactive';
  loadRides();
}

async function bookRide(){
  const name = document.getElementById('riderName').value.trim();
  const phone = document.getElementById('riderPhone').value.trim();
  const pickup = document.getElementById('pickup').value.trim();
  const dropoff = document.getElementById('dropoff').value.trim();
  if(!name || !phone || !pickup || !dropoff){ alert('Please fill all fields'); return; }
  document.getElementById('bookMsg').innerText = 'Sending...';
  const { data, error } = await supabaseClient.from('rides').insert([{rider_name:name, rider_phone:phone, pickup:pickup, dropoff:dropoff, status:'pending'}]).select();
  if(error){ document.getElementById('bookMsg').innerText = 'Error: '+error.message; }
  else{
    document.getElementById('bookMsg').innerText = '✅ Ride requested! Drivers will see it now.';
    document.getElementById('pickup').value=''; document.getElementById('dropoff').value='';
    loadRides();
  }
}

async function registerDriver(){
  const name = document.getElementById('driverName').value.trim();
  const phone = document.getElementById('driverPhone').value.trim();
  const vehicle = document.getElementById('vehicle').value.trim();
  const plate = document.getElementById('plate').value.trim();
  if(!name || !phone){ alert('Fill name and phone'); return; }
  const { data, error } = await supabaseClient.from('drivers').insert([{full_name:name, phone:phone, vehicle:vehicle, plate_number:plate, is_online:true}]).select();
  if(error){ document.getElementById('driverMsg').innerText = 'Error: '+error.message; }
  else{
    currentDriverId = data[0].id;
    localStorage.setItem('lugore_driver_id', currentDriverId);
    document.getElementById('driverMsg').innerText = '✅ Registered! You are now online. You can accept rides below.';
    loadRides();
  }
}

async function loadRides(){
  const { data, error } = await supabaseClient.from('rides').select('*').order('created_at',{ascending:false}).limit(20);
  if(error){ document.getElementById('conn').innerText = '❌ Not connected: '+error.message; return; }
  document.getElementById('conn').innerText = '✅ Connected to Supabase - ' + data.length + ' rides';
  renderRides(data, 'ridesList', false);
  renderRides(data, 'driverRidesList', true);
}

function renderRides(rides, elementId, isDriver){
  const el = document.getElementById(elementId);
  if(!rides || rides.length===0){ el.innerHTML='<p class="small">No rides yet.</p>'; return; }
  el.innerHTML = rides.map(r => `
    <div class="ride">
      <b>${r.pickup} → ${r.dropoff}</b><br>
      <span class="small">Rider: ${r.rider_name} - ${r.rider_phone}</span><br>
      <span class="status ${r.status}">${r.status.toUpperCase()}</span>
      <span class="small"> • ${new Date(r.created_at).toLocaleString()}</span>
      <div style="margin-top:10px;display:flex;gap:8px">
        ${isDriver && r.status==='pending' ? `<button class="btn btn-green" style="padding:10px" onclick="acceptRide('${r.id}')">Accept Ride</button>` : ''}
        ${r.status==='accepted' ? `<button class="btn" style="padding:10px;background:#334155;color:white" onclick="completeRide('${r.id}')">Mark Completed</button>` : ''}
      </div>
    </div>
  `).join('');
}

async function acceptRide(id){
  if(!currentDriverId){ alert('Register as driver first'); showTab('driver'); return; }
  await supabaseClient.from('rides').update({status:'accepted', driver_id:currentDriverId}).eq('id',id);
  loadRides();
}

async function completeRide(id){
  await supabaseClient.from('rides').update({status:'completed'}).eq('id',id);
  loadRides();
}

// Auto load + realtime
loadRides();
supabaseClient.channel('rides-live').on('postgres_changes',{event:'*',schema:'public',table:'rides'},()=>loadRides()).subscribe();
setInterval(loadRides, 8000);
</script>
</body>
</html>
