<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#FBE9E9;font-family:Arial;color:#4A0000;padding:14px}
.card{background:#fff;border:1px solid #e5b8b8;border-radius:20px;padding:16px;margin:10px 0}
.gold{background:linear-gradient(135deg,#A52A2A,#C25A5A);color:#fff}
input,select{width:100%;padding:13px;border-radius:14px;border:1px solid #e5b8b8;margin:6px 0;background:#FFF5F5;box-sizing:border-box}
button{width:100%;padding:14px;border:0;border-radius:14px;font-weight:900;cursor:pointer}
.hidden{display:none}
table{width:100%;border-collapse:collapse;font-size:12px} th,td{border:1px solid #eee;padding:6px;text-align:left}
</style>
</head>
<body>
<h2 style="text-align:center;color:#800000">LUGORE STAFF<br>SAVINGS GROUP</h2>
<p id="conn" style="text-align:center;font-size:12px">Connecting...</p>

<div id="loginBox" class="card">
<h3 style="text-align:center;margin:0">LOGIN</h3>
<input id="username" placeholder="Username e.g. Admin">
<input id="password" type="password" placeholder="Password e.g. admin123">
<button class="gold" onclick="doLogin()">LOGIN</button>
<p id="loginMsg" style="text-align:center;color:red;font-size:12px"></p>
<p style="text-align:center;font-size:11px">Admin / admin123</p>
</div>

<div id="appBox" class="hidden">
<div class="card"><b id="welcome"></b> <span id="role"></span><br><button onclick="logout()" style="background:#fee2e2;color:red;margin-top:8px">LOGOUT</button></div>

<div class="card"><h3>Add Member (Admin)</h3>
<input id="newName" placeholder="Full Name">
<input id="newPass" placeholder="Password">
<select id="newRole"><option value="member">member</option><option value="admin">admin</option></select>
<button class="gold" onclick="addMember()">ADD MEMBER</button><p id="memberMsg"></p></div>

<div class="card"><h3>Add Saving</h3>
<select id="saveMember"></select>
<select id="saveMonth"></select>
<input id="saveDate" type="date">
<input id="saveAmount" type="number" placeholder="Amount e.g. 50000">
<button class="gold" onclick="addSaving()">SAVE SAVING</button><p id="saveMsg"></p></div>

<div class="card"><h3>All Members</h3><div id="membersList"></div></div>
<div class="card"><h3>All Savings</h3><div id="savingsList"></div></div>
</div>

<script>
const supabaseClient = supabase.createClient("https://mpndeajnoxrmvpxtbrlo.supabase.co","sb_publishable_DHyal88n3SWkgeOn29k2tQ__AhyXEoD");
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MONTH_NUM={"January":0,"February":1,"March":2,"April":3,"May":4,"June":5,"July":6,"August":7,"September":8,"October":9,"November":10,"December":11};
function calcPenalty(month,datePaid){
  if(!month||!datePaid) return 0;
  var d=new Date(datePaid); var mNum=MONTH_NUM[month];
  var dueYear=d.getFullYear(); var dueMonth=mNum+1; if(dueMonth>11){dueMonth=0;dueYear++;}
  if(mNum==11 && d.getMonth()==11){dueYear=d.getFullYear()+1;dueMonth=0;}
  var due=new Date(dueYear,dueMonth,10); due.setHours(0,0,0,0); d.setHours(0,0,0,0);
  if(d<=due) return 0;
  var m=(d.getFullYear()-due.getFullYear())*12+(d.getMonth()-due.getMonth())+1;
  return Math.max(1,m)*3000;
}
let currentUser=null;

async function checkConn(){
  const r = await supabaseClient.from('members').select('*');
  if(r.error){ document.getElementById('conn').innerText='❌ '+r.error.message; }
  else{ document.getElementById('conn').innerText='✅ Connected - '+r.data.length+' members'; }
}
checkConn();

async function doLogin(){
  alert('Button clicked! Checking...'); // DEBUG - if you see this, button works
  const u=document.getElementById('username').value.trim();
  const p=document.getElementById('password').value.trim();
  if(!u||!p){ document.getElementById('loginMsg').innerText='Fill name and password'; return; }
  document.getElementById('loginMsg').innerText='Checking...';
  const r = await supabaseClient.from('members').select('*');
  if(r.error){ document.getElementById('loginMsg').innerText='Error: '+r.error.message; return; }
  let found=null;
  for(let m of r.data){ if(m.name.toLowerCase().replace(/\s/g,'')===u.toLowerCase().replace(/\s/g,'')){ found=m; break; } }
  if(!found){ document.getElementById('loginMsg').innerText='❌ User not found'; return; }
  if(String(found.password).trim()!==p){ document.getElementById('loginMsg').innerText='❌ Wrong password'; return; }
  currentUser=found;
  localStorage.setItem('lugore_user', JSON.stringify(found));
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('appBox').classList.remove('hidden');
  document.getElementById('welcome').innerText='Welcome, '+found.name;
  document.getElementById('role').innerText='('+found.role+')';
  loadData();
}
function logout(){ localStorage.removeItem('lugore_user'); location.reload(); }
async function loadData(){
  const m = await supabaseClient.from('members').select('*').order('name');
  const s = await supabaseClient.from('savings').select('*').order('created_at',{ascending:false});
  document.getElementById('saveMember').innerHTML=(m.data||[]).map(x=>`<option value="${x.name}">${x.name}</option>`).join('');
  document.getElementById('saveMonth').innerHTML=MONTHS.map(x=>`<option value="${x}" ${x===MONTHS[new Date().getMonth()]?'selected':''}>${x}</option>`).join('');
  document.getElementById('saveDate').value=new Date().toISOString().slice(0,10);
  document.getElementById('membersList').innerHTML='<table><tr><th>Name</th><th>Role</th></tr>'+(m.data||[]).map(x=>`<tr><td>${x.name}</td><td>${x.role}</td></tr>`).join('')+'</table>';
  document.getElementById('savingsList').innerHTML='<table><tr><th>Member</th><th>Month</th><th>Date</th><th>Amount</th><th>Penalty</th></tr>'+(s.data||[]).map(x=>`<tr><td>${x.member}</td><td>${x.month}</td><td>${x.date_paid||''}</td><td>${x.amount}</td><td>${calcPenalty(x.month,x.date_paid)}</td></tr>`).join('')+'</table>';
}
async function addMember(){
  const n=document.getElementById('newName').value.trim(); const p=document.getElementById('newPass').value.trim(); const r=document.getElementById('newRole').value;
  if(!n||!p){ alert('Fill name and password'); return; }
  const res=await supabaseClient.from('members').insert([{name:n,password:p,role:r}]);
  document.getElementById('memberMsg').innerText=res.error?'Error: '+res.error.message:'✅ Added '+n; loadData();
}
async function addSaving(){
  const member=document.getElementById('saveMember').value; const month=document.getElementById('saveMonth').value;
  const date=document.getElementById('saveDate').value; const amt=Number(document.getElementById('saveAmount').value);
  if(!amt){ alert('Enter amount'); return; }
  const pen=calcPenalty(month,date);
  const res=await supabaseClient.from('savings').insert([{member:member,shares:1,month:month,date_paid:date,amount:amt,penalty:pen,total:amt}]);
  document.getElementById('saveMsg').innerText=res.error?'Error: '+res.error.message:'✅ Saved! Penalty: '+pen; loadData();
}
const saved=localStorage.getItem('lugore_user');
if(saved){ try{ currentUser=JSON.parse(saved); document.getElementById('loginBox').classList.add('hidden'); document.getElementById('appBox').classList.remove('hidden'); document.getElementById('welcome').innerText='Welcome, '+currentUser.name; document.getElementById('role').innerText='('+currentUser.role+')'; loadData(); }catch(e){} }
</script>
</body>
</html>
